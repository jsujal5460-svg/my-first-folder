<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Classic Pullover Hoodie | SANDY ARVE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<div id="cartPanel">

    <div class="cartHeader">
        <h2>Your Cart</h2>
        <button id="closeCart">×</button>
    </div>

    <div id="cartItems">
        <p>Your cart is empty.</p>
    </div>

</div>
    <header>

        <img src="images/logo.png" alt="Sandy Arve Logo" class="siteLogo">

        <p class="aboutTagline">Wear Your Identity.</p>

        <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>

   <a href="#" id="cartButton" aria-label="Open shopping cart">
    <svg class="cartIcon" viewBox="0 0 24 24">
        <path d="M6 8h12l1 13H5L6 8z"></path>
        <path d="M9 8V6a3 3 0 0 1 6 0v2"></path>
    </svg>
</a>
</nav>

    </header>

    <main class="product-detail">

        <section class="product-detail-images">

            <img
                src="images/hoodie-front.jpg"
                alt="Classic Pullover Hoodie Front View"
                class="detail-main-image"
                id="hoodieMainImage"
            >

            <div class="detail-thumbnails">

                <img
                    src="images/hoodie-front.jpg"
                    alt="Hoodie Front View"
                    class="detail-thumbnail"
                    onclick="document.getElementById('hoodieMainImage').src='images/hoodie-front.jpg'"
                >

                <img
                    src="images/hoodie-back.jpg"
                    alt="Hoodie Back View"
                    class="detail-thumbnail"
                    onclick="document.getElementById('hoodieMainImage').src='images/hoodie-back.jpg'"
                >

            </div>

        </section>

        <section class="product-detail-info">

            <p class="product-category">Hoodies</p>

            <h1>Classic Pullover Hoodie</h1>

            <p class="detail-price">£15.99</p>

            <p class="detail-description">
                A relaxed oversized hoodie made for everyday wear,
                with a soft heavyweight feel and clean streetwear fit.
            </p>

            <div class="product-option">

                <p>Colour</p>

                <button class="colour-option" type="button">
                    Brown
                </button>

            </div>

            <div class="product-option">

                <p>Select Size</p>

                <div class="size-options">
    <button type="button" onclick="selectSize(this)">S</button>
    <button type="button" onclick="selectSize(this)">M</button>
    <button type="button" onclick="selectSize(this)">L</button>
    <button type="button" onclick="selectSize(this)">XL</button>
</div>

            </div>

            <button class="add-to-bag" type="button" onclick="addHoodieToBag()">
    Add to Bag
</button>

<p id="bagMessage"></p>

            <div class="product-extra">
                <p>Free delivery on orders </p>
                <p>Easy 14-day returns</p>
            </div>

        </section>

    </main>
<script>

let selectedSize = "";

function selectSize(button) {

    document.querySelectorAll(".size-options button").forEach(btn => {
        btn.classList.remove("selected-size");
    });

    button.classList.add("selected-size");

    selectedSize = button.textContent;
}

function addHoodieToBag() {

    if (selectedSize === "") {
        document.getElementById("bagMessage").textContent =
            "Please select a size first.";
        return;
    }

    const product = {
        name: "Classic Pullover Hoodie",
        price: 15.99,
        size: selectedSize,
        image: "images/hoodie-front.jpg",
        quantity: 1
    };

    let cart = JSON.parse(localStorage.getItem("sandyArveCart")) || [];

    cart.push(product);
localStorage.setItem("sandyArveCart", JSON.stringify(cart));
    updateCartCount();

    document.getElementById("bagMessage").textContent =
        "Added to bag ✓";
}
function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem("sandyArveCart")) || [];

    const totalItems = cart.reduce((sum, item) => {
        return sum + item.quantity;
    }, 0);

    document.getElementById("cartCount").textContent = totalItems;
}




updateCartCount();
</script>
<script src="script.js"></script>
</body>

</html>
